<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta (updated by script.js from config.js) -->
    <title>Wedding</title>
    <meta name="description" content="" />
    <link rel="canonical" href="https://yourdomain.com" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="images/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="X &amp; T" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
        rel="stylesheet" />

    <!-- Supabase (for RSVP) — loaded async, used only on form submit -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>

    <!-- Config must load before script.js -->
    <script src="config.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- ══════════════════════════════════════════════════════ -->
    <!--  NAVIGATION                                           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="container nav-inner">

            <a href="#" class="nav-monogram" aria-label="Scroll to top">X &amp; T</a>

            <ul class="nav-links" role="list">

                <li><a href="#gallery" data-i18n="nav.gallery"></a></li>
                <li><a href="#venues" data-i18n="nav.details"></a></li>
            </ul>

            <a href="#rsvp" class="nav-rsvp" data-i18n="nav.rsvp"></a>

            <button class="nav-toggle" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="mobile-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </nav>

    <!-- Mobile fullscreen navigation overlay -->
    <div id="mobile-nav" class="nav-overlay" role="dialog" aria-modal="true" aria-label="Navigation menu">
        <a href="#gallery" data-i18n="nav.gallery"></a>
        <a href="#venues" data-i18n="nav.details"></a>
        <a href="#rsvp" data-i18n="nav.rsvp"></a>
    </div>

    <main id="main-content">

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  HERO                                                 -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="hero" class="hero" aria-label="Welcome">

            <div class="hero-image-wrapper" aria-hidden="true">
                <img id="hero-img" class="hero-image" src="" alt="" fetchpriority="high" decoding="sync" />
            </div>

            <div class="hero-overlay" aria-hidden="true"></div>

            <div class="hero-content">
                <p class="hero-eyebrow" data-i18n="hero.eyebrow"></p>
                <h1 id="hero-names" class="hero-names">
                    Xaris <span class="ampersand">&amp;</span> Tasos
                </h1>
                <p id="hero-date" class="hero-date"></p>

                <!-- Countdown sits inside the hero -->
                <div class="hero-countdown">
                    <p class="hero-countdown-intro" data-i18n="countdown.intro"></p>
                    <div class="hero-countdown-grid" id="countdown-grid" aria-live="polite" aria-atomic="true">
                        <div class="hero-countdown-unit">
                            <span id="cd-days" class="hero-countdown-number">00</span>
                            <span class="hero-countdown-label" data-i18n="countdown.days"></span>
                        </div>
                        <div class="hero-countdown-unit">
                            <span id="cd-hours" class="hero-countdown-number">00</span>
                            <span class="hero-countdown-label" data-i18n="countdown.hours"></span>
                        </div>
                        <div class="hero-countdown-unit">
                            <span id="cd-minutes" class="hero-countdown-number">00</span>
                            <span class="hero-countdown-label" data-i18n="countdown.minutes"></span>
                        </div>
                        <div class="hero-countdown-unit">
                            <span id="cd-seconds" class="hero-countdown-number">00</span>
                            <span class="hero-countdown-label" data-i18n="countdown.seconds"></span>
                        </div>
                    </div>
                    <p id="countdown-married" class="hero-countdown-married" style="display:none;" aria-live="polite">
                    </p>
                </div>

                <a href="#rsvp" class="btn btn-light">RSVP</a>
            </div>

            <div class="hero-scroll" aria-hidden="true">
                <div class="hero-scroll-line"></div>
                <span class="hero-scroll-text">Scroll</span>
            </div>

        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  SAVE THE DATE                                        -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="savedate" class="save-date-section" aria-labelledby="savedate-heading">
            <div class="container save-date-layout">

                <div class="save-date-text">
                    <span class="section-tag" data-i18n="events.tag"></span>
                    <h2 id="savedate-heading" class="save-date-heading" data-i18n="events.heading"></h2>
                    <p class="save-date-when" id="save-date-when"></p>
                    <p class="save-date-subtitle" data-i18n="events.subtitle"></p>
                </div>

                <div class="save-date-photo-wrap">
                    <div class="save-date-heart-badge" aria-hidden="true">♥</div>
                    <img id="save-date-photo" class="save-date-photo" src="" alt="" loading="lazy" decoding="async" />
                </div>

            </div>
        </section>


        <!-- ══════════════════════════════════════════════════════ -->
        <!--  COUPLE PHOTO                                         -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="couple-photo" class="couple-photo-section" aria-labelledby="couple-photo-heading">
            <div class="container">
                <header class="section-header">
                    <span class="section-tag">Μια Ιστορία Αγάπης</span>
                    <h2 id="couple-photo-heading">Το ζευγάρι</h2>
                </header>
            </div>
            <img id="couple-photo-img" class="couple-photo-img" src="" alt="" loading="lazy" decoding="async" />
        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  VENUES / EVENT DETAILS                               -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="venues" class="events-section" aria-labelledby="venues-heading">
            <div class="container">

                <header class="section-header">
                    <span class="section-tag" data-i18n="events.tag"></span>
                    <h2 id="venues-heading" data-i18n="venues.heading"></h2>
                    <p data-i18n="venues.subtitle"></p>
                </header>

                <div id="events-grid" class="events-grid">
                    <!-- Rendered by script.js -->
                </div>

            </div>
        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  WITNESSES / ΜΑΡΤΥΡΕΣ                                 -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="witnesses" class="witnesses-section" aria-labelledby="witnesses-heading">
            <div class="container">

                <header class="section-header">
                    <span class="section-tag" data-i18n="witnesses.tag"></span>
                    <h2 id="witnesses-heading" data-i18n="witnesses.heading"></h2>
                </header>

                <div id="witnesses-grid" class="witnesses-grid">
                    <!-- Rendered by script.js -->
                </div>

            </div>
        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  RSVP                                                 -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="rsvp" class="rsvp-section" aria-labelledby="rsvp-heading">
            <div class="container">

                <header class="section-header">
                    <span class="section-tag" data-i18n="rsvp.tag"></span>
                    <h2 id="rsvp-heading" data-i18n="rsvp.heading"></h2>
                    <p><span data-i18n="rsvp.deadlinePrefix"></span> <span id="rsvp-deadline"></span></p>
                </header>

                <form id="rsvp-form" class="rsvp-form" novalidate aria-label="RSVP form">

                    <div class="form-group">
                        <label for="rsvp-name" class="form-label">
                            <span data-i18n="rsvp.nameLbl"></span> <span aria-hidden="true">*</span>
                        </label>
                        <input id="rsvp-name" name="name" type="text" class="form-input"
                            data-i18n-placeholder="rsvp.namePlaceholder" required autocomplete="name" maxlength="200" />
                    </div>

                    <div class="form-group">
                        <label for="rsvp-email" class="form-label">
                            <span data-i18n="rsvp.emailLbl"></span> <span aria-hidden="true">*</span>
                        </label>
                        <input id="rsvp-email" name="email" type="email" class="form-input"
                            data-i18n-placeholder="rsvp.emailPlaceholder" required autocomplete="email"
                            maxlength="200" />
                    </div>

                    <fieldset class="form-group">
                        <legend class="form-label">
                            <span data-i18n="rsvp.attendanceLbl"></span> <span aria-hidden="true">*</span>
                        </legend>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="attendance" value="yes" required />
                                <span data-i18n="rsvp.yes"></span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="attendance" value="no" />
                                <span data-i18n="rsvp.no"></span>
                            </label>
                        </div>
                    </fieldset>

                    <div id="guests-field" class="form-group hidden">
                        <label for="rsvp-guests" class="form-label" data-i18n="rsvp.guestsLbl"></label>
                        <select id="rsvp-guests" name="guests" class="form-select"></select>
                    </div>

                    <div class="form-group">
                        <label for="rsvp-dietary" class="form-label" data-i18n="rsvp.dietaryLbl"></label>
                        <input id="rsvp-dietary" name="dietary" type="text" class="form-input"
                            data-i18n-placeholder="rsvp.dietaryPlaceholder" maxlength="500" />
                    </div>

                    <div class="form-group">
                        <label for="rsvp-message" class="form-label" data-i18n="rsvp.messageLbl"></label>
                        <textarea id="rsvp-message" name="message" class="form-textarea"
                            data-i18n-placeholder="rsvp.messagePlaceholder" maxlength="1000"></textarea>
                    </div>

                    <button id="rsvp-submit" type="submit" class="rsvp-submit" data-i18n="rsvp.submitBtn"></button>

                </form>

                <div id="rsvp-success" class="rsvp-success hidden" role="alert" aria-live="polite" aria-atomic="true">
                </div>
                <div id="rsvp-error" class="rsvp-error hidden" role="alert" aria-live="assertive" aria-atomic="true">
                </div>
                <div id="rsvp-demo-note" class="rsvp-demo-note hidden" role="note"></div>

            </div>
        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  GUEST PHOTO UPLOAD                                   -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="photos" class="photos-section" aria-labelledby="photos-heading">
            <div class="container">

                <header class="section-header">
                    <span class="section-tag" data-i18n="photos.tag"></span>
                    <h2 id="photos-heading" data-i18n="photos.heading"></h2>
                    <p data-i18n="photos.subtitle"></p>
                </header>

                <div class="photos-inner">
                    <div class="photos-icon" aria-hidden="true">📷</div>
                    <p id="photos-note" class="photos-note"></p>
                    <div class="photos-actions">
                        <a id="photos-upload-link" href="#" target="_blank" rel="noopener noreferrer" class="photos-btn"
                            data-i18n="photos.btn"></a>
                        <a id="photos-view-link" href="#" target="_blank" rel="noopener noreferrer"
                            class="photos-btn photos-btn-outline" data-i18n="photos.viewBtn"></a>
                    </div>
                </div>

            </div>
        </section>

        <!-- ══════════════════════════════════════════════════════ -->
        <!--  CONTACT                                              -->
        <!-- ══════════════════════════════════════════════════════ -->
        <section id="contact" class="contact-section" aria-labelledby="contact-heading">
            <div class="container">

                <header class="section-header">
                    <span class="section-tag" data-i18n="contact.tag"></span>
                    <h2 id="contact-heading" data-i18n="contact.heading"></h2>
                </header>

                <div class="contact-inner">
                    <p id="contact-note" class="contact-note"></p>
                    <div id="contact-phones" class="contact-phones"></div>
                </div>

            </div>
        </section>

    </main>

    <!-- ══════════════════════════════════════════════════════ -->
    <!--  FOOTER                                               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <footer>
        <p id="footer-names" class="footer-names"></p>
        <p id="footer-date" class="footer-date"></p>
        <p class="footer-copy" data-i18n="footer.madeWith"></p>
    </footer>



    <!-- script.js must come after config.js (already loaded in <head>) -->
    <script src="script.js"></script>

    <!-- PWA: register service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => { });
            });
        }
    </script>

</body>

</html>
