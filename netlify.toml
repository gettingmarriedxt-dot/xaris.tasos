[build]
  publish = "."

# index.html and admin.html: always revalidate so visitors get updates immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# manifest files: always revalidate so install prompt stays fresh
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# config.js: 1-hour cache — short enough to pick up content changes quickly
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# CSS: 1-week cache
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS: 1-week cache (wildcard — sw.js rule below overrides this for that file)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Images: cache for 1 year — filenames never change
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG icon: cache for 1 year — content never changes
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# sw.js MUST come last — Netlify last-match-wins, overrides the /*.js rule above
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
